services:
  # ── Unified Full-Stack Web Service (FastAPI + React) ────────────────────────
  - type: web
    name: yantrodharaka
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./yantrodharaka.db
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: FRONTEND_ORIGIN
        value: "*"
      - key: ADMIN_EMAIL
        value: admin@yantrodharaka.in
      - key: ADMIN_PASSWORD
        sync: false
      - key: STORAGE_BACKEND
        value: local
