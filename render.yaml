services:
  # ── 1. Backend Web Service (FastAPI) ─────────────────────────────
  - type: web
    name: yantrodharaka-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./yantrodharaka.db
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: FRONTEND_ORIGIN
        sync: false
      - key: ADMIN_EMAIL
        value: admin@yantrodharaka.in
      - key: ADMIN_PASSWORD
        sync: false
      - key: STORAGE_BACKEND
        value: local

  # ── 2. Frontend Static Site (React / Vite) ───────────────────────
  - type: web
    name: yantrodharaka-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
